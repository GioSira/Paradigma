[pytest]
minversion = 7.0

# --------------------------------------------------------------- raccolta ---------------------------------------------------------------
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---------------------------------------------------------------- opzioni ---------------------------------------------------------------
# -ra                riepilogo finale di skip, xfail ed errori, con il motivo
# --strict-markers   un marker non dichiarato qui sotto e' un errore, non un refuso silenzioso
# --strict-config    una chiave sconosciuta in questo file e' un errore
# -m                 di default solo i test veloci; quelli su servizi esterni
#                    si chiedono esplicitamente (vedi i comandi in fondo)

addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not integration"

markers =
    integration: test su servizi esterni reali (Pinecone). esclusi di default, richiedono PINECONE_API_KEY
    slow: test lenti che creano e cancellano risorse remote

# Un test marcato xfail che inizia a passare fa fallire la suite: il bug
# e' stato corretto e il marker va tolto.
xfail_strict = true

# Un parametrize con lista vuota e' un errore di raccolta, non uno skip silenzioso.
empty_parameter_set_mark = fail_at_collect

# Gli avvisi sono errori: una deprecazione si scopre qui
# Per un avviso di una libreria esterna che non puoi correggere, aggiungi una
# riga `ignore` mirata (categoria + modulo), mai un `ignore` generico.
filterwarnings =
    error

# Report JUnit per la CI (usato solo con --junitxml=report.xml).
junit_family = xunit2

# ------------------------------------------------------------------ comandi
#   pytest                          test unitari (default)
#   pytest -m integration           solo i test su Pinecone
#   pytest -m "integration and not slow"   su Pinecone, senza creare indici temporanei
#   pytest -m ""                    tutti